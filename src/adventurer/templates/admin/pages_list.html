<!doctype html>
<title>Pages</title>
<h1>Pages</h1>
<p><a href="{{ url_for('admin_new_page') }}">New page</a></p>
<ul>
  {% for page in pages %}
  <li>
    <a href="{{ url_for('admin_edit_page', page_id=page['id']) }}">
      {{ page['title'] }}
    </a>
    <span>{{ page['type'] }}</span>
    <form method="post" action="{{ url_for('admin_delete_page', page_id=page['id']) }}">
      <button type="submit">Delete</button>
    </form>
  </li>
  {% endfor %}
</ul>
