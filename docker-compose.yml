services:
  app:
    # Pull the published image, or build locally with `docker compose up --build`.
    image: ghcr.io/will-reid-tong/adventurer:latest
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # First-run admin login. Override in a .env file or the shell.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      # The SQLite database (including image BLOBs) is the single file
      # data/app.db on the host, so backups are just a file copy.
      - ./data:/data
