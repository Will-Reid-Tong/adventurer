[project]
name = "cyoa"
version = "0.1.0"
description = "A choose-your-own-adventure engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "gunicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyoa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 90

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"
